name: Release Version Bump

on: create

jobs:
  bump:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    permissions:
      contents: write
      pull-requests: write
    uses: Skagiggs/ci-workflows/.github/workflows/release-version-bump-node.yml@v1
    with:
      node-version: "24"
      base-branch: main
      rebase-onto: develop # à confirmer / adapter, voir NOTES-MIGRATION.md
