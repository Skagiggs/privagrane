name: Release Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write
    uses: Skagiggs/ci-workflows/.github/workflows/release-publish-node.yml@v1
    with:
      node-version: "24"
      base-branch: main
